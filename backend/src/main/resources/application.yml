spring:
  application:
    name: intervai

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intervAI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Root@7317}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000

  gemini:
    api-key: ${GEMINI_API_KEY:}

  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB
    s3:
      bucket: ${AWS_S3_BUCKET:intervai-resumes}
    gcs:
      bucket: ${GCS_BUCKET:intervai-resumes}

server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500

logging:
  level:
    root: INFO
    com.intervai: DEBUG

spring:
  application:
    name: intervai
  datasource:
    url: jdbc:h2:mem:interview_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:8a9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f}
      expiration-ms: 86400000 # 24 hours
  gemini:
    api-key: ${GEMINI_API_KEY:mock_key}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.intervai: DEBUG

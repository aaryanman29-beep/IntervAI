spring:
  application:
    name: intervai

  datasource:
    url: jdbc:mysql://localhost:3306/intervAI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
    password: Root@7317
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000

  gemini:
    api-key: ${GEMINI_API_KEY:}

  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.intervai: DEBUG

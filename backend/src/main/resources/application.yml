spring:
  application:
    name: intervai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/intervai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB
    s3:
      bucket: ${AWS_S3_BUCKET:intervai-resumes}
    gcs:
      bucket: ${GCS_BUCKET:intervai-resumes}

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200

logging:
  level:
    root: INFO
    com.intervai: INFO

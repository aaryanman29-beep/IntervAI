spring:
  application:
    name: intervai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000,http://localhost:8443,https://*.netlify.app}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB
    s3:
      bucket: ${AWS_S3_BUCKET:intervai-resumes}
    gcs:
      bucket: ${GCS_BUCKET:intervai-resumes}

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.intervai: INFO

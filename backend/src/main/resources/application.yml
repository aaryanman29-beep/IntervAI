spring:
  application:
    name: intervai

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/intervai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

intervai:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    stt-model-id: ${ELEVENLABS_STT_MODEL_ID:scribe_v2}
    api-url: ${ELEVENLABS_API_URL:https://api.elevenlabs.io/v1/speech-to-text}

  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    max-file-size: 5MB
    s3:
      bucket: ${AWS_S3_BUCKET:intervai-resumes}
    gcs:
      bucket: ${GCS_BUCKET:intervai-resumes}

server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500

logging:
  level:
    root: INFO
    com.intervai: DEBUG

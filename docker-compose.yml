services:
  db:
    image: mysql:9.0
    container_name: intervai-mysql
    restart: always
    environment:
      MYSQL_DATABASE: intervAI
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - internal-net
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intervai-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
      - public-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/intervAI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intervai-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - public-net
    ports:
      - "80:80"

networks:
  internal-net:
    internal: true
  public-net:

volumes:
  db_data:
